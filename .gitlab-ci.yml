# Production deploy to Vercel from GitLab, through the Vercel CLI (the Vercel Hobby plan cannot
# use its Git integration with a private GitLab group). Vercel builds the site with the project's
# own settings and environment variables. The job exists only on main, and only when the group
# CI/CD variable VERCEL_TOKEN is set. "Run pipeline" on main in GitLab redeploys by hand.

stages: [deploy]

deploy-production:
  stage: deploy
  image: node:24
  resource_group: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(push|web|api)$/ && $VERCEL_TOKEN
  variables:
    VERCEL_ORG_ID: team_j9noT8uLhzzPlYmIURQhKQQ8
    VERCEL_PROJECT_ID: prj_SFb5ECrfFrNhZ4pTSd4QMQCqoNzm
  environment:
    name: production
    url: https://web-whitesec-energy-tupb.vercel.app
  script:
    - npx --yes vercel@59.10.0 deploy --prod --yes
